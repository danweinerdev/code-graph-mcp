[package]
name = "code-graph-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP server that builds an in-memory semantic code graph from source files"

[lints]
workspace = true

[dependencies]
code-graph-core = { path = "../code-graph-core" }
code-graph-lang = { path = "../code-graph-lang" }
code-graph-lang-cpp = { path = "../code-graph-lang-cpp" }
code-graph-lang-csharp = { path = "../code-graph-lang-csharp" }
code-graph-lang-go = { path = "../code-graph-lang-go" }
code-graph-lang-java = { path = "../code-graph-lang-java" }
code-graph-lang-python = { path = "../code-graph-lang-python" }
code-graph-lang-rust = { path = "../code-graph-lang-rust" }
code-graph-graph = { path = "../code-graph-graph" }
code-graph-tools = { path = "../code-graph-tools" }
rmcp = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
getrandom = "0.3"
libc = "0.2"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
# Win32 bindings only (no native library, D-0004): the daemon proxy must
# clear HANDLE_FLAG_INHERIT on its standard handles before spawning the
# daemon contender, and stable std exposes no handle-inheritance control.
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tokio = { workspace = true }
