[package]
name = "code-graph-vcs-git"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Git VCS provider and hermetic test fixtures"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
code-graph-vcs = { path = "../code-graph-vcs" }
# Canonical long-form binding for the discovered working tree: graph paths
# are dunce-canonicalized, and repository-relative containment is lexical.
dunce = { workspace = true }
gix = "0.86.0"
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
