[package]
name = "code-graph-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP tool handlers, discovery walker, indexer, and watcher"

[lints]
workspace = true

[dependencies]
code-graph-core = { path = "../code-graph-core" }
code-graph-lang = { path = "../code-graph-lang" }
code-graph-graph = { path = "../code-graph-graph" }
# Trait + registry only (AC-23): no VCS backend dependency enters this
# crate. The git implementation is injected by the binary crate.
code-graph-vcs = { path = "../code-graph-vcs" }
rmcp = { workspace = true }
notify-debouncer-full = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ignore = { workspace = true }
crossbeam-channel = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
# Test-only: integration tests exercise blame_symbol against a real git
# fixture through the production provider, and implement provider test
# doubles (async-trait mirrors the trait crate's own usage). Runtime
# confinement (AC-23) is unaffected — dev-dependencies do not enter the
# shipped graph.
code-graph-vcs-git = { path = "../code-graph-vcs-git" }
async-trait = { workspace = true }
code-graph-lang-cpp = { path = "../code-graph-lang-cpp" }
code-graph-lang-csharp = { path = "../code-graph-lang-csharp" }
code-graph-lang-go = { path = "../code-graph-lang-go" }
code-graph-lang-java = { path = "../code-graph-lang-java" }
code-graph-lang-python = { path = "../code-graph-lang-python" }
code-graph-lang-rust = { path = "../code-graph-lang-rust" }
tempfile = { workspace = true }
walkdir = { workspace = true }
insta = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
